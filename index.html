    <title>China Song</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <header>
      <div class="sun"></div>

      <section class="music-grid">

          <iframe
            src="https://www.youtube.com/embed/WtaUE4HHPPs"
            title="China DJ Song"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            allowfullscreen
          >
          </iframe>

          <h2>China DJ Song</h2>

          <span>waibo de ge</span>
        </article>

        <article class="song-card cyan">
          <iframe
            src="https://www.youtube.com/embed/gej4WnUvJus"
            title="China DJ Music"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            allowfullscreen
          >
          </iframe>

          <h2>China remix Music</h2>

          <span>东方DJ</span>
        </article>
      </section>
    </main>

    <footer>
      <div class="tentao">黄章明</div>
